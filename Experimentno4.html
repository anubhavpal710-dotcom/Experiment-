<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXPERIMENT 4 </title>
</head>
<body> 
    <fieldset> 
        <form action="#"></form>
        <h1>Hotel Room Booking Form</h1>
        <label for="text ">Full Name</label>
        <input type="text" name="name" id="name">
        <br>
        <br>
        <label for="email">Email</label>
        <input type="email" name="email" id="name">
        <br>
        <br>
        <label for="tel ">Phone</label>
        <input type="tel " name="tel" id="tel">
        <br>
        <br>
        <label for="dob">Check in Date</label>
        <input type="date" name="dob " id="dob">
        <br>
        <br>
        <label for="dob">Check out Date</label>
        <input type="date" name="dob " id="dob">
        <br>
        <br>
        <label for="lang">Room type</label>
        <select name="lang" id="lang">
            <option value="Single room ">Single room</option>
        <option value="Double room " > Double room </option>

        </select>
        <br>
        <br>
        <label for="number">Number of guests</label>
        <input type="number" name="number" id="number">
        <br>
        <br>
        <label for="add">Special Requests</label>
        <textarea name="add" id="add"></textarea> 
        <br>
        <br>
        <input type="Submit" name="Book Now">
        <input type="reset" name="reset Form ">
    </fieldset>
    

</body>
</html>
